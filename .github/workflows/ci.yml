name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Pinned images: the -latest labels move under you and the runner warns about it.
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Checkout runs git init; naming the default branch keeps git's hint out of the log.
      - name: Configure git
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      # --trust lets the package's postinstall fetch the native binary; bun skips it otherwise.
      - name: Install Claude Code
        run: bun add -g --trust @anthropic-ai/claude-code@2.1.325
      # --strict fails on validation warnings, including TypeScript errors in hooks modules and tests
      # (type checking since 2.1.323). Plugin directory advisories, such as a missing listing icon or
      # license, are printed but do not fail the build.
      - name: Validate marketplace
        run: claude plugin validate --strict .
      - name: Validate and test each mod
        run: |
          for manifest in */.claude-plugin/plugin.json; do
            mod="${manifest%%/*}"
            echo "::group::$mod"
            if ! claude plugin validate --strict "$mod"; then echo "::error::$mod validation failed"; exit 1; fi
            # claude plugin test needs a hooks module; a mod without one (such as a status-line script) runs bun test.
            if [ -f "$mod/hooks/hooks.json" ]; then claude plugin test "$mod"; else bun test "$mod"; fi
            echo "::endgroup::"
          done
